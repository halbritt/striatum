# striatum repo overlay — EXTEND-ONLY. Base rules come from the vendored
# doc-convention-lint package (github.com/halbritt/doc-convention-lint), pinned by
# SHA in .pre-commit-config.yaml. This file may only add roots / path_exceptions /
# sanctioned_regions; the linter refuses any overlay that redefines the rules.
#
# striatum keeps curated docs in docs/{how-to,reference,rfcs,decisions,agents}
# plus a doc-map.md "one home per concept" contract.
# Whitelist the legitimate curated repo-root docs here.
path_exceptions:
  ARCHITECTURE.md: { type: reference, optional_frontmatter: true }
  CONTRIBUTING.md: { type: how-to, optional_frontmatter: true }
  AGENTS.md: { type: reference, optional_frontmatter: true }
  CHANGELOG.md: { type: reference, optional_frontmatter: true }
  # NOTE: loose root-level STRIATUM_<TASK>_<MODEL>_<DATE>.md audits are NOT whitelisted.
  # Whole-repo audits belong under docs/audits/.

# Sanctioned operational regions — tooling-owned runtime surfaces recognized IN PLACE,
# neither Diataxis nor records, and NEVER folded. docs/operator/ is the canonical
# operator tree the daemon reads at runtime (RFC 0058: BRIEF.md, plans/, progress/,
# briefs/); ~18 Go files + tests resolve these paths and accepted decisions cite them
# as frozen provenance. Exempt from type/path/front-matter checks.
sanctioned_regions:
  - "docs/operator/**"
  - "docs/campaigns/**"
