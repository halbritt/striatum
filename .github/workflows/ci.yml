name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Vet + lint need no database, so they run on their own runner in parallel
  # with the test job rather than serially inside `make check`.
  lint:
    name: Vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      # Accumulating Go build/module cache: restore the most recent cache for
      # this go.sum (or any prior one), save a fresh per-commit snapshot. Keyed
      # per job because the lint build (vet/staticcheck) and the race-instrumented
      # test build are different object sets.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-lint-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-lint-${{ hashFiles('go/go.sum') }}-
            ${{ runner.os }}-go-lint-

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" --version

      - name: Vet and lint
        run: make -C go vet lint

  test:
    name: Test, coverage, and smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: striatum
          POSTGRES_PASSWORD: striatum
          POSTGRES_DB: striatum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U striatum -d striatum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STRIATUM_PG_TEST_URL: postgres://striatum:striatum@localhost:5432/striatum_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-test-${{ hashFiles('go/go.sum') }}-
            ${{ runner.os }}-go-test-

      # Single instrumented pass: race detection AND core coverage in one run
      # (check-tests), instead of the old separate test + race + coverage passes
      # that re-ran the PostgreSQL-heavy suite three times.
      - name: Verify modules, then test with race and coverage
        run: make -C go verify check-tests

      - name: Build release archive
        run: make release-archives

      - name: Check release archive
        run: make check-release-archives

      - name: Go package smoke
        run: make package-smoke

      - name: Fresh clone smoke
        run: make smoke

  # RFC 0096 / #87 lane-isolation gate (D244).
  #
  # Disposition: this is OPERATOR-PROVISIONED HARDENING, not a mandatory-in-CI
  # check. The negative control (make lane-isolation-check) fundamentally needs
  # host provisioning a stock runner cannot have — a dedicated PG-less lane OS
  # user, passwordless `sudo -n -u`, and PostgreSQL pg_hba reject rules (see
  # docs/how-to/lane-sandbox.md). So this job ALWAYS appears in the checks list
  # for legibility, but the gate itself runs only when the host advertises
  # provisioning via the STRIATUM_LANE_ISOLATION_HOST repo/org variable set to
  # "1"; on a stock runner the var is unset and the gate SKIPS LOUDLY (exit 0,
  # printing that it did NOT run) so a green CI never falsely implies the
  # isolation gate executed. To actually run it, a provisioned self-hosted
  # runner sets the STRIATUM_LANE_ISOLATION_HOST=1 variable plus the
  # STRIATUM_LANE_OS_USER / *_UNIX_URL / *_TCP_URL probe env (see the runbook).
  lane-isolation-gate:
    name: Lane-isolation gate (operator-provisioned, D244)
    runs-on: ubuntu-latest
    env:
      STRIATUM_LANE_ISOLATION_HOST: ${{ vars.STRIATUM_LANE_ISOLATION_HOST }}
      STRIATUM_LANE_OS_USER: ${{ vars.STRIATUM_LANE_OS_USER }}
      STRIATUM_LANE_ISOLATION_UNIX_URL: ${{ vars.STRIATUM_LANE_ISOLATION_UNIX_URL }}
      STRIATUM_LANE_ISOLATION_TCP_URL: ${{ vars.STRIATUM_LANE_ISOLATION_TCP_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Lane-isolation negative control (runs only on a provisioned host)
        run: make lane-isolation-check-ci
