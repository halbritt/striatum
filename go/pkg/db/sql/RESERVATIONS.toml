# RESERVATIONS.toml — collision-proof migration-ordinal ledger (RFC 0142 Layer 0, D258).
#
# This is the allocation authority a reviewer cannot forget to check. Every
# runtime-migration ordinal (the NNNN of go/pkg/db/sql/NNNN_*.sql) and every
# owner-bundle ordinal (go/pkg/db/sql/owner/NNNN_*.sql) is reserved here. When
# you add a migration or bundle, add its row below in the SAME change — the
# TestReservationLedgerMatchesOnDisk guard (a normal go test in pkg/db, so
# CI's go test IS the guard) reds on any file with no row, any row with no
# file, a DUPLICATE ordinal, or a GAP in the sequence. Two PRs can no longer
# silently grab the same NNNN (the 0039 / 0041 collisions, RFC 0142 failure #4).
#
# Frontiers: runtime_migration = 0042, owner_bundle = 0019.
#
# Format: a tiny array-of-tables (a purpose-built parser in reservations.go
# reads only `ordinal` and `file`; keep it that simple and human-legible).
# A `note` is optional documentation only and is not parsed.

